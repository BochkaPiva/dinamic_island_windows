name: Community service checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['server/**', '.github/workflows/accounts.yml']
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cloud_accounts
          POSTGRES_USER: cloud_accounts
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: cloud_accounts
      PGUSER: cloud_accounts
      PGPASSWORD: ci-only-not-a-production-secret
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --only-binary=:all: -r server/requirements.txt
      - run: python server/manage.py makemigrations --check --dry-run
      - run: python server/manage.py test accounts community --verbosity 2
