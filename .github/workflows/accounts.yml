name: Community service checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['server/**', '.github/workflows/accounts.yml']
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cloud_accounts
          POSTGRES_USER: cloud_accounts
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: cloud_accounts
      PGUSER: cloud_accounts
      PGPASSWORD: ci-only-not-a-production-secret
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --only-binary=:all: -r server/requirements.txt
      - run: python server/manage.py makemigrations --check --dry-run
      - run: python server/manage.py test accounts community --verbosity 2
